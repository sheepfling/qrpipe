name: Deploy QR Pipe receiver to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag whose receiver to publish
        required: true
        default: feat/optical-10mib-harness
        type: string

permissions:
  contents: read

concurrency:
  group: qrpipe-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test receiver
        run: npm run test:receiver
      - name: Build static receiver
        run: npm run build:receiver
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: receiver/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
