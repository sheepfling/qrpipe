name: CI

on:
  push:
  pull_request:

jobs:
  iphone-receiver:
    name: iPhone receiver
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Test receiver core
        run: swift test --package-path ios/ReceiverCore
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -quiet -project ios/QrpipeReceiver.xcodeproj -scheme QrpipeReceiver \
            -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build

  checks:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run quality gates
        run: python -m scripts.ci
